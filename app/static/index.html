<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoBank</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AutoBank</div>
    <div id="user-box" hidden>
      <span id="user-name"></span>
      <button id="logout" class="ghost">Ieșire</button>
    </div>
  </header>

  <main>
    <div id="toast" role="status" hidden></div>

    <section id="auth-view" class="card narrow">
      <div class="tabs">
        <button data-tab="login" class="tab active">Autentificare</button>
        <button data-tab="register" class="tab">Cont nou</button>
      </div>
      <form id="login-form">
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Parolă <input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Intră în cont</button>
      </form>
      <form id="register-form" hidden>
        <label>Nume complet <input name="full_name" required minlength="2"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Parolă (min. 8 caractere) <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <button type="submit">Creează cont</button>
      </form>
    </section>

    <section id="app-view" hidden>
      <div class="row-head">
        <h2>Conturile mele</h2>
        <form id="new-account-form" class="inline">
          <input name="name" placeholder="Nume cont" value="Economii" maxlength="100">
          <select name="currency"><option>RON</option><option>EUR</option><option>USD</option></select>
          <button type="submit" class="ghost">+ Deschide cont</button>
        </form>
      </div>
      <div id="accounts" class="accounts"></div>

      <div id="account-detail" class="grid" hidden>
        <div class="card">
          <h3 id="detail-title"></h3>
          <p class="iban"><span id="detail-iban"></span> <button id="copy-iban" class="link">copiază</button></p>
          <p class="balance" id="detail-balance"></p>

          <div class="tabs small">
            <button data-op="transfer" class="tab active">Transfer</button>
            <button data-op="deposit" class="tab">Depunere</button>
            <button data-op="withdraw" class="tab">Retragere</button>
          </div>
          <form id="op-form">
            <label data-only="transfer">IBAN destinatar <input name="to_iban" placeholder="RO.."></label>
            <label>Sumă <input name="amount" type="number" step="0.01" min="0.01" required></label>
            <label>Descriere <input name="description" maxlength="140"></label>
            <button type="submit" id="op-submit">Trimite</button>
          </form>
        </div>

        <div class="card">
          <h3>Istoric tranzacții</h3>
          <ul id="transactions" class="tx-list"></ul>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
